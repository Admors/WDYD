<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tests Unitaires</title>
  <style>
    body { font-family: monospace; padding: 2rem; background: #0f172a; color: #fff; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
  </style>
</head>
<body>
  <h1>Résultats des tests</h1>
  <div id="output"></div>

  <script type="module">
    import { runTests } from './app.test.js';
    const output = document.getElementById('output');
    const results = runTests();

    results.forEach(res => {
      const el = document.createElement('div');
      el.className = res.pass ? 'pass' : 'fail';
      el.textContent = `${res.pass ? '✓ PASS' : '✗ FAIL'}: ${res.message}`;
      output.appendChild(el);
    });
  </script>
</body>
</html>
