name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Installation des dépendances
        run: npm ci

      - name: Exécution des tests unitaires (Vitest)
        run: npm run test

      - name: Compilation du projet (Vite)
        run: npm run build

      # Désactive le moteur Jekyll de GitHub Pages pour éviter les erreurs de type MIME / 404
      - name: Bypass Jekyll sur GitHub Pages
        run: touch ./dist/.nojekyll

      # Bloque le déploiement si le dossier dist ne contient pas le HTML ou le JS compilé
      - name: Verification de la validité de la build
        run: |
          test -f ./dist/index.html || (echo "Erreur: index.html manquant dans dist" && exit 1)
          test -d ./dist/assets || (echo "Erreur: Dossier assets manquant dans dist" && exit 1)

      - name: Préparation de l'artifact pour Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4